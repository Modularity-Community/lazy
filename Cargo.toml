[package]
name = "lazy"
version = "0.0.1"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
iced = {version="0.14.0", features=["tokio", "highlighter", "advanced"]} 
nerd_fonts = "0.1.9"
reqwest = {version="0.13", features=["json"]}
serde = {version="1.0.229", features=["derive"]}
serde_json = "1.0.154"
sqlx = {version = "0.9.0", features=["sqlite", "runtime-tokio", "migrate"]} 
tokio = {version = "1", features=["full"]}
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
